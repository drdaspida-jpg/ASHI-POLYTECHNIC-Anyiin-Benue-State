<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Documents | Ashi Polytechnic</title><link rel="stylesheet" href="../css/documents.css"><style>.panel{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:24px;margin-top:24px}.panel h2{margin-top:0}form{display:grid;gap:12px}input,select,textarea{padding:13px;border:1px solid #dfe6ef;border-radius:10px;font:inherit}button{border:0;background:#041a3f;color:#fff;padding:13px;border-radius:10px;font-weight:700;cursor:pointer}.hidden{display:none}.msg{padding:12px;border-radius:10px;background:#f5f7fb}</style></head><body><header class="doc-header"><a class="brand" href="../index.html"><img src="../assets/logo.png" alt="Ashi Polytechnic"></a><div><strong>Admin Document Centre</strong><span>Secure PDF management</span></div></header><main class="wrap"><section class="hero"><p class="eyebrow">ADMINISTRATION</p><h1>Documents</h1><p>Upload official PDFs to Cloudflare R2 and publish their metadata in Supabase PostgreSQL.</p></section><section id="loginPanel" class="panel"><h2>Administrator login</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="loginMsg" class="msg"></p></section><section id="uploadPanel" class="panel hidden"><h2>Upload PDF</h2><form id="uploadForm"><input id="title" placeholder="Document title" required><textarea id="description" placeholder="Description"></textarea><select id="category"><option value="admission">Admission</option><option value="handbook">Handbook</option><option value="fees">Fee schedule</option><option value="forms">Forms</option><option value="timetable">Timetable</option><option value="other">Other</option></select><select id="visibility"><option value="authorized">Authorized users</option><option value="public">Public</option><option value="admin">Admins only</option></select><input id="file" type="file" accept="application/pdf" required><button>Upload PDF</button></form><p id="uploadMsg" class="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/admin-documents.js"></script></body></html>
